# Build the demo SPA and publish to GitHub Pages on every push to main.
# The demo uses relative asset/base paths (vite base './'), so it works
# unchanged under https://caitq2024.github.io/auto_auction/.
# Pages hosts the STATIC part only (leaderboard/replay/traces/explainer);
# the self-serve experiment section detects no backend and degrades.
name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm ci
        working-directory: demo
      - run: npm run build
        working-directory: demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
