    model_id: global.anthropic.claude-sonnet-5
    prompt_template: v2
    max_alpha: 2000
  - name: opus5
    strategy: llm
    model_id: global.anthropic.claude-opus-5
    prompt_template: v2
    max_alpha: 2000
  - name: deepseekr1
    strategy: llm
    model_id: us.deepseek.r1-v1:0
    prompt_template: v2
    max_alpha: 2000
  - name: nova2lite
    strategy: llm
    model_id: global.amazon.nova-2-lite-v1:0
